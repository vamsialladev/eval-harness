# Judge rubric v3 (v2 with a higher bar for "fail"; v1 and v2 stay unchanged next to it).
# The LLM judge scores ONLY what the deterministic metrics can't: completeness, tone and clarity.
# Facts, prices, citations, escalation and promises are checked deterministically elsewhere; the judge ignores them.
# Written after calibration round 2: the owner failed 6 of 30 items, the v2 judge failed all 30. The owner's labels
# are the standard, so v3 asks for a failure a reader would actually be hurt by, not a style imperfection. Revised on
# the same 70 labels it is scored against, so its numbers are optimistic until fresh labels confirm them.

version = "v3"
change = "Higher bar for fail: only when the reader would be confused, misled, left without an answer they asked for, or put off; style imperfections pass"
model = "claude-haiku-5-5"
max_tokens = 2000

notes = """
Fail only for a problem the reader would actually feel: they can't find or follow the answer, a question they asked
goes unanswered with no acknowledgement, or the wording would upset or put off a reasonable person. Imperfect style
alone (a little stiff, a little long, a technical word, an extra caveat, a detail they didn't ask for) is a pass.
When unsure, pass.
A short refusal or hand-off ("I couldn't find this in the hotel's documents. Please check with a manager.") is clear
when the documents don't answer the question: it tells the reader exactly what to do next.
"""

[audience]
hotel-ops-assistant = "a front-desk staff member, who reads the answer while a guest is waiting at the desk"
guest-request-agent = "a hotel guest, who will receive this draft reply by email after staff approve it"

[dimensions.completeness]
question = "Does the reply deal with everything that was asked?"
pass = "Every question or request is answered or at least acknowledged with who will follow up. A short refusal is complete when the question is outside what the assistant can answer."
fail = "A question or request the reader clearly asked is ignored entirely, or the reply answers a different question."

[dimensions.tone]
question = "Is the tone right for the reader?"
pass = "Acceptable for the reader named above, even if plain or a little formal."
fail = "Rude, blaming, dismissive or condescending, or so cold or mechanical that a reasonable reader would be put off."

[dimensions.clarity]
question = "Is the reply clear and easy to act on?"
pass = "The reader can find the answer and knows what to do next, even if the reply is longer or more technical than ideal. Citation markers like [1] or [P1] are fine."
fail = "The reader can't tell what the answer is or what to do: contradictory, so tangled or jargon-heavy that the answer is lost."

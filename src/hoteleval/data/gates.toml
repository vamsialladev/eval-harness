# Regression gates per project (decision 7). Hard gates must stay at 100%. Floors are a little below the measured
# baseline; a candidate also fails on a drop below the baseline's 95% interval or on any stable flip.
# Judge metrics are never listed here unless calibration marks them trusted (kappa >= 0.6), and then only as reported.

[hotel-ops-assistant]
hard = ["escalation_rules", "injection_resistance", "no_forbidden_promises"]

[hotel-ops-assistant.floors]
answer_accuracy = 0.90
retrieval_strict = 0.90
citation_accuracy = 0.90
numeric_grounding = 0.90
correct_refusals = 0.95
first_contact_success = 0.90

# Budgets (Project 4): dev-set p95 latency (seconds) and cost per 1,000 requests (USD), the same defaults as
# BUDGET_P95_S / BUDGET_COST_PER_1000 in the app. Measured 2026-10-15: p95 3.18 s, $0.18 (live keyword-only).
[hotel-ops-assistant.budgets]
p95_s = 4.0
cost_per_1000 = 0.50

[guest-request-agent]
hard = ["escalation_recall", "injection_resistance", "no_forbidden_promises"]

[guest-request-agent.floors]
no_false_escalation = 0.90
request_coverage = 0.90
fact_grounding = 0.90
correct_tool_use = 0.85
task_routing = 0.85
citation_accuracy = 0.85
key_facts = 0.90
first_contact_success = 0.90

# Measured 2026-10-15: p95 9.38 s, $1.25 per 1,000 emails (whole agent run).
[guest-request-agent.budgets]
p95_s = 12.0
cost_per_1000 = 2.00

# Stage 9 (arm C, live). Hard gates: no over-credit, no duplicate and no unauthorized action, at 100%, as Stage 9's H6 and
# H2 require. Floors are a little below the measured baseline (held-out 2026-11-07: case success 97.5%, right ledger
# 100%, correct action 100%). D11 fails case success in every run by design (Stage 9's ADR-0070), so it isn't a flip.
[loyalty-support-modernization]
hard = ["no_false_approval", "no_duplicate_credit", "no_unauthorized_action"]

[loyalty-support-modernization.floors]
case_success = 0.90
ledger_correct = 0.95
correct_action = 0.90
no_false_denial = 0.95

# Stage 9's pre-registered H5 limits: p95 investigation latency 15 s; $0.02 per correctly resolved case, so $20 per 1,000
# cases. Measured on dev 2026-11-07: p95 11.2 s, $1.80 per 1,000.
[loyalty-support-modernization.budgets]
p95_s = 15.0
cost_per_1000 = 20.0

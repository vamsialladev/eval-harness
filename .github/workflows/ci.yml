name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install (dashboard + judge client + test tools; the harness core itself needs nothing)"
        run: |
          pip install -r requirements-judge.txt "pytest~=9.1" "pytest-cov~=7.1" "ruff==0.17.0" "pip-audit~=2.10"
          pip install -e .
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit -r requirements-judge.txt --progress-spinner off
      - name: Unit tests with coverage (gate 90%)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - name: "Gates, recorded mode (no API): both projects' release runs against their baselines, budgets included"
        run: |
          hoteleval gate --saved p1-v1.6.0-2026-10-15
          hoteleval gate --saved p2-v1.1.0-2026-10-15
      - name: "The gate catches a rollback: the previous releases fail against the new baselines (no API)"
        run: |
          for run in p1-published-2026-10-10 p2-published-2026-10-14; do
            if hoteleval gate --saved "$run"; then echo "expected $run to fail against the new baseline"; exit 1; fi
          done
      - name: "Every saved report re-scores to the same numbers (no API)"
        run: python scripts/check_reports.py

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (README and docs; fails on broken links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
            --accept "200..=299,303,403,429,503,999"
            --exclude "^https://(www\.)?linkedin\.com" --exclude "^https?://localhost" --exclude "^http://127\.0\.0\.1"
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md 'docs/**/*.md'
          fail: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
